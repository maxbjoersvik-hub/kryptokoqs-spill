/* ---------- Visuelt (v0.9) ---------- */
header.topp{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 1rem}
header.topp h1{margin:0}
#stilknapp{font-size:13px;padding:6px 10px}
.hane{display:block;width:100%;height:100%;overflow:visible}
.scene{position:relative;height:250px;border-radius:12px;overflow:hidden;border:0.5px solid var(--border)}
.scene .bg{position:absolute;inset:0;width:100%;height:100%}
.s-piksel{border:3px solid #0f380f;border-radius:4px;image-rendering:pixelated}
.plattform{position:absolute;border-radius:50%}
.s-tegne .plattform{background:#6fb84a;border:2px solid #4e8f33}
.s-piksel .plattform{background:#8bac0f;border:2px solid #306230;border-radius:50%}
.plE{right:5%;top:112px;width:38%;height:22px}
.plP{left:2%;bottom:6px;width:42%;height:26px}
.spr{position:absolute;aspect-ratio:1}
.sprE{right:9%;top:6px;width:31%}
.sprP{left:5%;bottom:12px;width:36%}
.spr .kropp{width:100%;height:100%;transform-origin:50% 88%;transition:transform .9s cubic-bezier(.5,-0.4,.6,1.2)}
.vend{width:100%;height:100%;transform:scaleX(-1)}
.spr .fx{position:absolute;inset:10%;pointer-events:none}
.spr .sand{position:absolute;left:10%;right:10%;bottom:4%;height:18%;border-radius:50% 50% 8% 8%;opacity:0;transform:scaleY(.2);transform-origin:bottom;transition:opacity .4s .5s,transform .4s .5s}
.s-tegne .sand{background:#e9cf8c;border:2px solid #2a1a10}
.s-piksel .sand{background:#306230;border:2px solid #0f380f;border-radius:4px 4px 0 0}
/* Villmøtet: hanene glir inn fra hver sin side */
.inn.sprE .kropp{animation:innE .8s ease-out}
.inn.sprP .kropp{animation:innP .8s ease-out}
@keyframes innE{from{transform:translateX(-230%)}to{transform:none}}
@keyframes innP{from{transform:translateX(200%)}to{transform:none}}
/* Angrep: hopper frem mot motstanderen */
.sprP.hopp .kropp{animation:hoppP .35s ease-out}
.sprE.hopp .kropp{animation:hoppE .35s ease-out}
@keyframes hoppP{50%{transform:translate(18%,-14%)}}
@keyframes hoppE{50%{transform:translate(-18%,12%)}}
.jubel .kropp{animation:jubel .5s ease-out}
@keyframes jubel{30%{transform:translateY(-12%) scale(1.06)}60%{transform:translateY(0) scale(.97)}}
/* Treff: blinking og risting. Fulltreff: mer av alt. */
.treff .kropp{animation:blink .5s steps(1) .2s,rist .5s ease-in-out .2s}
.fulltreff .kropp{animation:blink .8s steps(1) .2s,ristStor .8s ease-in-out .2s}
@keyframes blink{0%,20%,40%,60%,80%{opacity:.15}10%,30%,50%,70%,90%,100%{opacity:1}}
@keyframes rist{20%{transform:translateX(-6%)}40%{transform:translateX(6%)}60%{transform:translateX(-4%)}80%{transform:translateX(3%)}}
@keyframes ristStor{15%{transform:translateX(-10%) rotate(-6deg)}30%{transform:translateX(10%) rotate(6deg)}45%{transform:translateX(-8%) rotate(-4deg)}60%{transform:translateX(8%) rotate(4deg)}80%{transform:translateX(-3%)}}
/* Bom: motstanderen dukker unna */
.sprE.unnvik .kropp{animation:unnvikE .5s ease-out .15s}
.sprP.unnvik .kropp{animation:unnvikP .5s ease-out .15s}
/* Låvetaket og søvn */
.paa-tak .kropp{transform:translateY(-60%) scale(.75)}
.sover::after{content:'Z z z';position:absolute;right:0;top:0;font:700 14px system-ui,sans-serif;color:var(--text-secondary);animation:zzz 2s ease-in-out infinite}
@keyframes zzz{50%{transform:translateY(-8px);opacity:.5}}
/* Gir opp: stikker hodet i sanden */
.spr.ko{clip-path:inset(-60% -60% 10% -60%)}
.sprP.ko .kropp{transform:translateY(4%) rotate(62deg)}
.sprE.ko .kropp{transform:translateY(4%) rotate(-62deg)}
.ko .sand{opacity:1;transform:scaleY(1)}
.sprP.ko .sand{left:66%;right:-30%}
.sprE.ko .sand{left:-30%;right:66%}
/* Typeeffekter */
.eff{position:absolute;inset:0;width:100%;height:100%;opacity:0;overflow:visible}
.anim-spru{animation:spru .6s ease-out .15s}
.anim-stig{animation:stig .8s ease-out .15s}
.anim-fall{animation:fall .6s ease-in .1s}
@keyframes spru{0%{opacity:1;transform:scale(.3)}60%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.3)}}
@keyframes stig{0%{opacity:0;transform:translateY(30%) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-40%) scale(1.1)}}
@keyframes fall{0%{opacity:1;transform:translateY(-70%)}70%{opacity:1;transform:translateY(0)}100%{opacity:0}}
.s-tegne{--eo:#2a1a10}
.s-tegne .eff-Ild{--e1:#ff8a1e;--e2:#ffd23f}.s-tegne .eff-Vann{--e1:#57b0e6}.s-tegne .eff-Is{--e1:#cdefff;--e2:#8fd3ea}.s-tegne .eff-Magi{--e1:#f2d24b}.s-tegne .eff-Muskel{--e1:#ffd23f}
.s-tegne .eff-Lyn{--e1:#ffe14a}.s-tegne .eff-Jord{--e1:#8a6a3a}.s-tegne .eff-Spøkelse{--e1:#f4f2fb}.s-tegne .eff-Fly{--e1:#f2b3c8}.s-tegne .eff-Hakk{--e1:#fff3b0}
.s-piksel{--eo:#0f380f;--e1:#306230;--e2:#8bac0f}
.pop{position:absolute;left:0;right:0;top:42%;text-align:center;font:700 16px system-ui,sans-serif;color:#fff;-webkit-text-stroke:1px #2a1a10;opacity:0;pointer-events:none}
.pop.stor{font-size:26px;color:#ffd23f}
.pop.vis{animation:popp .9s ease-out}
@keyframes popp{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-12px)}}
.s-piksel .pop{font-family:ui-monospace,Menlo,monospace;color:#9bbc0f;-webkit-text-stroke:0;text-shadow:2px 2px 0 #0f380f,-2px -2px 0 #0f380f,2px -2px 0 #0f380f,-2px 2px 0 #0f380f}
/* Infobokser */
.info{position:absolute;width:52%;padding:6px 8px;font-size:12px;line-height:1.3}
.infoE{left:3%;top:10px}.infoP{right:3%;bottom:14px}
.s-tegne .info{background:rgba(255,255,255,.92);color:#1f1e1c;border:2px solid #2a1a10;border-radius:10px;box-shadow:2px 3px 0 rgba(0,0,0,.18)}
.s-piksel .info{background:#9bbc0f;color:#0f380f;border:3px solid #0f380f;border-radius:0;font-family:ui-monospace,Menlo,monospace;font-weight:700;box-shadow:3px 3px 0 #306230}
.inavn{display:flex;justify-content:space-between;gap:6px;font-size:13px}
.imaler{display:flex;align-items:center;gap:6px;margin-top:4px}
.ilbl{font-size:9px;font-weight:700;min-width:30px;letter-spacing:.03em}
.ibar{flex:1;height:7px;border-radius:4px;background:#ddd;overflow:hidden;border:1px solid #2a1a10}
.s-piksel .ibar{background:#8bac0f;border:2px solid #0f380f;border-radius:0;height:8px}
.ifill{height:100%;transition:width .4s}
.itall{text-align:right;font-size:11px;margin-top:2px}
.ipust{display:flex;gap:2px;flex:1}
.ipust i{flex:1;height:5px;border-radius:2px;background:#ddd}
.ipust i.pa{background:#378ADD}
.s-piksel .ipust i{border-radius:0;background:#8bac0f}.s-piksel .ipust i.pa{background:#0f380f}
.istatus{font-size:10px;margin-top:3px;opacity:.85}
/* Dialogboks som i Rød/Blå */
.dialog{margin-top:8px;padding:8px 10px;font-size:13px;line-height:1.5;min-height:84px}
.d-tegne{background:var(--surface-2);border:2px solid var(--border-strong);border-radius:10px;color:var(--text-primary)}
.d-piksel{background:#9bbc0f;color:#0f380f;border:4px double #0f380f;font-family:ui-monospace,Menlo,monospace;font-weight:600}
.dialog .runde{font-size:11px;opacity:.65}
.dialog .hl{font-weight:700}
/* Gården */
.gard{position:relative;height:190px;border-radius:12px;overflow:hidden;border:0.5px solid var(--border);margin-bottom:10px}
.gard .bg{position:absolute;inset:0;width:100%;height:100%}
.g-piksel{border:3px solid #0f380f;border-radius:4px}
.gardhane{position:absolute;left:24%;bottom:8px;width:38%;aspect-ratio:1}
.gardhane .hode{transform-origin:62px 52px;animation:nikk 5s ease-in-out infinite}
.gardhane .bein-bak{transform-origin:44px 74px;animation:skrap 5s ease-in-out infinite}
@keyframes nikk{0%,8%,22%,100%{transform:none}12%,18%{transform:rotate(22deg)}}
@keyframes skrap{0%,55%,75%,100%{transform:none}60%,70%{transform:rotate(38deg)}65%{transform:rotate(18deg)}}
.gardhane .f-peck,.gardhane .f-scratch{opacity:0}
.gardhane .f-stand{animation:visStand 5s steps(1,end) infinite}
.gardhane .f-peck{animation:visPeck 5s steps(1,end) infinite}
.gardhane .f-scratch{animation:visScratch 5s steps(1,end) infinite}
@keyframes visStand{0%{opacity:1}10%{opacity:0}20%{opacity:1}58%{opacity:0}72%{opacity:1}}
@keyframes visPeck{0%{opacity:0}10%{opacity:1}20%{opacity:0}}
@keyframes visScratch{0%{opacity:0}58%{opacity:1}72%{opacity:0}}
.gardhane svg{animation:pust 3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes pust{50%{transform:scaleY(1.02)}}
/* Reaksjoner */
.r-spis .hode{animation:spis .9s ease-in-out}
.r-spis .f-stand{animation:visStandSpis .9s steps(1,end)}.r-spis .f-peck{animation:visPeckSpis .9s steps(1,end)}.r-spis .f-scratch{animation:none}
@keyframes spis{15%,45%,75%{transform:rotate(38deg)}0%,30%,60%,90%{transform:none}}
@keyframes visStandSpis{0%{opacity:0}15%{opacity:1}30%{opacity:0}45%{opacity:1}60%{opacity:0}75%{opacity:1}}
@keyframes visPeckSpis{0%{opacity:1}15%{opacity:0}30%{opacity:1}45%{opacity:0}60%{opacity:1}75%{opacity:0}}
.r-stell svg{animation:kry 1s ease-out}
@keyframes kry{40%{transform:scale(1.05) translateY(2%)}}
.r-kos svg{animation:kos .9s ease-in-out}
@keyframes kos{25%{transform:scaleY(.9) scaleX(1.06)}50%{transform:scaleY(1.04)}}
.r-tren svg{animation:tren .6s ease-out}
@keyframes tren{40%{transform:translateY(-14%)}}
.partikler{position:absolute;inset:0;pointer-events:none}
.korn{position:absolute;top:40%;width:5px;height:5px;border-radius:50%;background:#e9b52f;border:1px solid #2a1a10;opacity:0;animation:korn .8s ease-in forwards}
.g-piksel .korn{background:#306230;border-color:#0f380f;border-radius:0}
@keyframes korn{0%{opacity:1;transform:translateY(-40px)}100%{opacity:1;transform:translateY(70px)}}
.glitter{position:absolute;width:10px;height:10px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:glitter .9s ease-out forwards}
.g-piksel .glitter{background:#0f380f}
@keyframes glitter{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(.6)}}
.hjerte{position:absolute;top:30%;font-size:18px;color:#e8504a;opacity:0;animation:hjerte 1.1s ease-out forwards}
.g-piksel .hjerte{color:#0f380f;font-family:ui-monospace,monospace}
@keyframes hjerte{0%{opacity:0;transform:translateY(10px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1.1)}}
/* Små hanebilder */
.minihane{width:64px;height:64px;margin:0 auto 4px}
.motehane{width:120px;height:120px;margin:4px auto 0}
.motehane .kropp{animation:innE .8s ease-out}
.plassholder{font-size:11px;color:var(--text-muted)}
.ik{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.ik-stor{width:30px;height:30px;margin:0!important}
.ik-knapp{display:flex;align-items:center;gap:10px}
body[data-stil=piksel] .ikf{--i1:#306230;--i2:#8bac0f;--i3:#8bac0f;--io:#0f380f}
body[data-stil=piksel] .ik-stor{shape-rendering:crispEdges}
/* ---------- v0.10: gården ---------- */
.fortelling{font-size:13px;color:var(--text-secondary);margin:-4px 2px 10px;min-height:1.5em;line-height:1.45}
.statuslinje{padding:10px 12px}
.sl-topp{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.sl-niva{font-size:13px;color:var(--text-secondary)}
.sl-xp{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-secondary);margin-top:6px}
.sl-xp .bar{flex:1;margin:0;height:6px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface-1);border-radius:8px;padding:6px 7px}
.chip .ik{width:18px;height:18px;color:var(--text-secondary)}
.chip-tekst{flex:1;min-width:0}
.chip-navn{font-size:11px;font-weight:500;line-height:1.2}
.chip-verdi{font-size:11px;color:var(--text-secondary);line-height:1.2;margin-top:3px;overflow-wrap:anywhere}
.chip-bar{height:4px;border-radius:2px;background:var(--border);margin-top:4px;overflow:hidden}
.chip-bar div{height:100%;background:var(--fill-success)}
.chip.lav .chip-bar div{background:var(--fill-danger)}.chip.lav .ik,.chip.lav .chip-verdi{color:var(--text-danger)}
.sl-status{font-size:12px;color:var(--text-secondary);margin-top:8px}
.faner{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;background:var(--surface-1);padding:4px;border-radius:10px}
.fane{border:0;border-radius:8px;font-size:12.5px;padding:7px 2px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--text-secondary)}
.fane.valgt{background:var(--surface-2);color:var(--text-primary);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panel{margin-top:10px}
.hint{font-size:12px;color:var(--text-secondary);margin-bottom:8px;line-height:1.45}
.hint .advar{color:var(--text-danger);font-weight:500}
.fliser{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.flis{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;background:var(--surface-2);text-align:center;min-height:86px}
.ik-flis{width:34px;height:34px}
.flis-navn{font-size:13px;font-weight:500;line-height:1.2}
.flis-info{font-size:11px;color:var(--text-secondary);line-height:1.2}
.egenskaper{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:6px 12px}
.eg{display:grid;grid-template-columns:1fr auto 44%;align-items:center;gap:10px;padding:6px 0;border-bottom:0.5px solid var(--border)}
.eg:last-child{border-bottom:0}
.eg-navn{font-size:13px}.eg-verdi{font-size:16px;font-weight:600;min-width:28px;text-align:right}
.eg-tren{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary)}
.eg-tren .bar{flex:1;margin:0;height:5px}
/* Snakkeboble og flytende tekst */
.boble{position:absolute;left:58%;top:10%;max-width:38%;background:#fff;color:#1f1e1c;border:2px solid #2a1a10;border-radius:12px;padding:5px 9px;font-size:12px;font-weight:600;line-height:1.3;opacity:0;animation:boble 2.6s ease-out .1s forwards}
.boble::after{content:'';position:absolute;left:-9px;bottom:10px;border:6px solid transparent;border-right-color:#2a1a10}
.boble.sen{animation-delay:1.1s}
.g-piksel .boble{background:#9bbc0f;color:#0f380f;border:3px solid #0f380f;border-radius:0;font-family:ui-monospace,Menlo,monospace}
@keyframes boble{0%{opacity:0;transform:scale(.6) translateY(6px)}12%{opacity:1;transform:scale(1.05)}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.flyt{position:absolute;left:63%;font:700 13px system-ui,sans-serif;color:#27500A;background:rgba(255,255,255,.88);border:1.5px solid #2a1a10;border-radius:999px;padding:1px 8px;opacity:0;animation:flyt 1.6s ease-out forwards}
.g-piksel .flyt{color:#0f380f;background:#9bbc0f;border:2px solid #0f380f;border-radius:0;font-family:ui-monospace,Menlo,monospace}
@keyframes flyt{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.glitter.sen{animation-duration:1s}
/* Fôring: maten kastes inn, hanen napper den, og bryster seg etterpå */
.mat{position:absolute;left:82%;top:16%;width:22%;aspect-ratio:1;opacity:0;animation:matKast 2.4s ease-in-out forwards}
.mat .ik{width:100%;height:100%}
@keyframes matKast{0%{opacity:1;transform:translate(260%,-160%) rotate(-200deg) scale(.7)}30%{opacity:1;transform:none}40%{opacity:1;transform:scale(1)}46%{opacity:1;transform:scale(.4) translateX(-30%)}50%{opacity:0;transform:scale(0)}100%{opacity:0}}
.mat-meitemark .ik{animation:vrikk .25s ease-in-out 6 alternate}
@keyframes vrikk{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.r-spis .hode{animation:napp 2.4s ease-in-out forwards}
@keyframes napp{0%,30%{transform:none}35%{transform:rotate(16deg)}39%{transform:none}43%{transform:rotate(16deg)}48%,55%{transform:none}65%,92%{transform:rotate(-10deg)}100%{transform:none}}
.r-spis svg.hane{animation:kryEtterMat 2.4s ease-in-out forwards}
@keyframes kryEtterMat{0%,32%{transform:none}38%{transform:translateX(3%)}42%{transform:none}46%{transform:translateX(3%)}50%,58%{transform:none}68%,92%{transform:scale(1.05)}100%{transform:none}}
.r-spis.r-lat svg.hane{animation:slapp 2.4s ease-in-out forwards}
@keyframes slapp{0%,50%{transform:none}65%,100%{transform:scaleY(.88) scaleX(1.06) translateY(5%)}}
.r-spis .f-stand,.r-spis .f-peck,.r-spis .f-scratch{animation:none}
/* ---------- v0.10: kampen ---------- */
.dialog{max-height:132px;overflow-y:auto;scroll-behavior:smooth;overscroll-behavior:contain}
.dialog .linje{padding:1px 0 1px 8px;border-left:3px solid transparent}
.dialog .fra-P{border-left-color:#378ADD}.dialog .fra-E{border-left-color:#E24B4A}
.d-piksel .fra-P{border-left:3px solid #0f380f}.d-piksel .fra-E{border-left:3px dotted #0f380f}
.dialog .rsep{font-size:11px;opacity:.6;text-align:center;margin:6px 0 2px;border-top:1px dashed currentColor;padding-top:2px}
.dialog .rsep:first-child{margin-top:0}
.nP{color:#1d5fa8}.nE{color:#b52b2a}
.d-piksel .nP,.d-piksel .nE,.banner .nP,.banner .nE{color:inherit}
@media (prefers-color-scheme:dark){.nP{color:#8cc0f2}.nE{color:#f19a99}}
.banner{position:absolute;left:50%;top:44%;transform:translateX(-50%);white-space:nowrap;font:700 13px system-ui,sans-serif;padding:4px 12px;border-radius:999px;opacity:0;pointer-events:none;z-index:5}
.s-tegne .banner{background:#fff;color:#1f1e1c;border:2px solid #2a1a10}
.s-tegne .banner.bP{box-shadow:inset 6px 0 0 #378ADD}.s-tegne .banner.bE{box-shadow:inset -6px 0 0 #E24B4A}
.s-piksel .banner{background:#9bbc0f;color:#0f380f;border:3px solid #0f380f;border-radius:0;font-family:ui-monospace,Menlo,monospace}
.banner .pil{margin-right:6px;font-size:11px}
.banner.vis{animation:banner 1.15s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:translateX(-50%) scale(.7)}12%{opacity:1;transform:translateX(-50%) scale(1.06)}20%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.s-tegne{--glow:0 0 0 3px #ffd23f,2px 3px 0 rgba(0,0,0,.18)}.s-piksel{--glow:0 0 0 3px #306230}
.info.aktiv{animation:aktiv 1.1s ease-out}
@keyframes aktiv{0%{transform:none;box-shadow:var(--glow)}15%{transform:scale(1.04);box-shadow:var(--glow)}30%{transform:none}85%{box-shadow:var(--glow)}}
.info.truffet{animation:truffet .5s ease-in-out .3s}
@keyframes truffet{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.ifill{transition:width .55s ease .3s,background .3s ease .3s}
/* Angrep: tar sats bakover og stuper frem */
.sprP.hopp .kropp{animation:angrepP .62s cubic-bezier(.3,0,.4,1)}
.sprE.hopp .kropp{animation:angrepE .62s cubic-bezier(.3,0,.4,1)}
@keyframes angrepP{0%{transform:none}25%{transform:translate(-10%,5%) rotate(-8deg)}52%{transform:translate(70%,-48%) rotate(10deg)}70%{transform:translate(50%,-34%) rotate(4deg)}100%{transform:none}}
@keyframes angrepE{0%{transform:none}25%{transform:translate(10%,-5%) rotate(8deg)}52%{transform:translate(-80%,62%) rotate(-10deg)}70%{transform:translate(-58%,44%) rotate(-4deg)}100%{transform:none}}
.treff .kropp{animation:hvit .55s steps(1) .3s,rist .55s ease-in-out .3s}
